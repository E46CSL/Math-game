<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Math Mania</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
        body { 
            touch-action: manipulation; -webkit-user-select: none; user-select: none; 
            overflow: hidden; position: fixed; width: 100%; height: 100%;
            background: #f0fdf4; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
        }
        
        #app-wrapper { height: 100%; display: flex; flex-direction: column; padding-top: var(--sat); padding-bottom: var(--sab); }

        .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-out:active { transform: scale(0.95); }
        
        .menu-card {
            aspect-ratio: 1/1; width: 120px; border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1); transition: transform 0.1s;
        }

        .formula-card, .feedback-card { 
            background: white; border: 4px solid #16a34a; border-radius: 1.5rem; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); width: 95%; max-width: 500px;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Responsive 10-column grid */
        .visual-grid { 
            display: grid; 
            grid-template-columns: repeat(10, minmax(0, 1fr)); /* Force columns to shrink */
            gap: 2px; 
            width: 100%; /* Take full width of parent */
            max-width: 100%;
            margin: 0 auto;
            padding: 8px;
            box-sizing: border-box;
        }

        .index-label { font-size: 0.6rem; color: #94a3b8; font-weight: bold; line-height: 1; margin-bottom: 2px; }

        .crossed-out { position: relative; opacity: 0.3; filter: grayscale(100%); }
        .crossed-out::after { content: '❌'; position: absolute; top: -2px; left: 0; font-size: 0.8rem; }

        #visual-container { 
            flex-grow: 1; 
            min-height: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; /* Prevent container-level scrolling */
            width: 100%;
        }

        #settings-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 100; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- Settings Modal -->
        <div id="settings-modal" onclick="toggleSettings()">
            <div class="bg-white p-6 rounded-3xl w-[90%] max-w-sm shadow-2xl bounce-in" onclick="event.stopPropagation()">
                <h2 class="text-2xl font-black mb-6 text-center text-slate-700 tracking-tight">Settings</h2>
                
                <div class="mb-6">
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-bold text-slate-700 text-sm">Row/Col Index Display (Beginner mode)</span>
                        <button onclick="toggleLabels()" class="w-12 h-7 bg-green-500 rounded-full relative transition-colors shrink-0" id="label-toggle-bg">
                            <div id="label-toggle-knob" class="absolute left-1 top-1 w-5 h-5 bg-white rounded-full transition-transform translate-x-[20px]"></div>
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400 italic leading-tight">* This option only applies for Count - Beginner mode. (Default: ON)</p>
                </div>

                <div class="mb-8">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-700 text-sm">Icon Display (Advanced / Expert mode)</span>
                        <button onclick="toggleAdvIcons()" class="w-12 h-7 bg-slate-300 rounded-full relative transition-colors shrink-0" id="adv-toggle-bg">
                            <div id="adv-toggle-knob" class="absolute left-1 top-1 w-5 h-5 bg-white rounded-full transition-transform"></div>
                        </button>
                    </div>
                </div>

                <button onclick="toggleSettings()" class="w-full py-4 bg-green-500 text-white font-black rounded-2xl shadow-lg pop-out tracking-widest text-lg">SAVE</button>
            </div>
        </div>

        <header class="p-3 flex flex-col items-center">
            <div class="flex justify-between w-full items-center mb-1">
                <div class="flex gap-2">
                    <button onclick="confirmExit()" class="w-10 h-10 bg-white rounded-full shadow-md border-2 border-red-500 font-bold text-red-500 pop-out flex items-center justify-center">⬅</button>
                    <button onclick="toggleSettings()" class="w-10 h-10 bg-white rounded-full shadow-md border-2 border-slate-300 pop-out flex items-center justify-center">⚙️</button>
                </div>
                <h1 class="text-xl font-black text-green-600 tracking-wider uppercase">Math Mania</h1>
                <div id="score-display" class="bg-yellow-400 text-white px-4 py-1 rounded-full font-black text-sm shadow-sm">Score: 0</div>
            </div>
            <div id="progress-container" class="flex gap-1 h-3"></div>
        </header>

        <main id="app" class="flex-grow flex items-center justify-center p-3"></main>
    </div>

    <script>
        const app = document.getElementById('app');
        const progressEl = document.getElementById('progress-container');
        const scoreEl = document.getElementById('score-display');
        
        let gameState = { mode: null, maxNum: 10, round: 1, score: 0, ans: 0, results: [], showLabels: true, showAdvIcons: false, questionPool: [], isPlaying: false };

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            updateToggleUI();
        }

        function toggleLabels() { gameState.showLabels = !gameState.showLabels; updateToggleUI(); }
        function toggleAdvIcons() { gameState.showAdvIcons = !gameState.showAdvIcons; updateToggleUI(); }

        function updateToggleUI() {
            document.getElementById('label-toggle-bg').className = gameState.showLabels ? "w-12 h-7 bg-green-500 rounded-full relative" : "w-12 h-7 bg-slate-300 rounded-full relative";
            document.getElementById('label-toggle-knob').style.transform = gameState.showLabels ? "translateX(20px)" : "translateX(0px)";
            document.getElementById('adv-toggle-bg').className = gameState.showAdvIcons ? "w-12 h-7 bg-green-500 rounded-full relative" : "w-12 h-7 bg-slate-300 rounded-full relative";
            document.getElementById('adv-toggle-knob').style.transform = gameState.showAdvIcons ? "translateX(20px)" : "translateX(0px)";
        }

        function speak(textArray, onEndCallback = null) { 
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(textArray.join(', '));
            if (onEndCallback) utterance.onend = () => { if(gameState.isPlaying) setTimeout(onEndCallback, 300); };
            window.speechSynthesis.speak(utterance);
        }

        function initMenu() {
            gameState.isPlaying = false; gameState.round = 1; gameState.score = 0; gameState.results = [];
            scoreEl.innerText = `Score: 0`; progressEl.innerHTML = '';
            app.innerHTML = `
                <div class="flex flex-col items-center gap-4 w-full max-sm">
                    <div onclick="setMode('count')" class="menu-card bg-red-400 pop-out bounce-in">
                        <span class="text-5xl block">🍎</span>
                        <span class="text-white font-black text-[10px] mt-1">COUNT</span>
                    </div>
                    <div class="flex gap-4">
                        <div onclick="setMode('add')" class="menu-card bg-green-400 pop-out bounce-in"><span class="text-5xl text-white">＋</span><span class="text-white font-black text-[10px] mt-1">ADD</span></div>
                        <div onclick="setMode('sub')" class="menu-card bg-orange-400 pop-out bounce-in"><span class="text-5xl text-white">－</span><span class="text-white font-black text-[10px] mt-1">MINUS</span></div>
                    </div>
                    <div class="flex gap-4">
                        <div onclick="setMode('mul')" class="menu-card bg-purple-400 pop-out bounce-in"><span class="text-5xl text-white">×</span><span class="text-white font-black text-[10px] mt-1">TIMES</span></div>
                        <div onclick="setMode('div')" class="menu-card bg-pink-400 pop-out bounce-in"><span class="text-5xl text-white">÷</span><span class="text-white font-black text-[10px] mt-1">DIVIDE</span></div>
                    </div>
                </div>`;
        }

        function setMode(id) { 
            const labels = {count:'Count', add:'Add', sub:'Minus', mul:'Times', div:'Divide'};
            gameState.mode = {id, label: labels[id]};
            speak([labels[id]]);
            showLevels(); 
        }

        function showLevels() {
            const lvls = [
                {n:10, s:'⭐', l:'Beginner', c:'border-yellow-300'},
                {n:20, s:'⭐⭐', l:'Intermediate', c:'border-orange-400'},
                {n:50, s:'⭐⭐⭐', l:'Advanced', c:'border-red-500'},
                {n:100, s:'⭐⭐⭐⭐', l:'Expert', c:'border-purple-600'}
            ];
            app.innerHTML = `<div class="grid grid-cols-2 gap-3 w-full max-w-xs">${lvls.map(l => `<div onclick="start(${l.n})" class="bg-white border-4 ${l.c} p-4 rounded-3xl text-center shadow-md pop-out bounce-in"><span class="text-xl block">${l.s}</span><span class="font-black text-slate-700 text-sm">${l.l}</span></div>`).join('')}</div>`;
        }

        function start(max) { gameState.maxNum = max; gameState.isPlaying = true; generatePool(); nextRound(); }

        function generatePool() {
            let p = [], m = gameState.mode.id, x = gameState.maxNum;
            if(m==='count') for(let i=1;i<=x;i++) p.push({v1:i, v2:0, ans:i});
            else if(m==='add') for(let i=1;i<x;i++) for(let j=1;i+j<=x;j++) p.push({v1:i, v2:j, ans:i+j});
            else if(m==='sub') for(let i=1;i<=x;i++) for(let j=1;j<=i;j++) p.push({v1:i, v2:j, ans:i-j});
            else if(m==='mul') for(let i=1;i<=10;i++) for(let j=1;i*j<=x;j++) p.push({v1:i, v2:j, ans:i*j});
            else if(m==='div') for(let j=2;j<=5;j++) for(let a=1;a*j<=x;a++) p.push({v1:a*j, v2:j, ans:a});
            gameState.questionPool = p.sort(()=>Math.random()-0.5).slice(0,10);
        }

        function nextRound() {
            if(!gameState.isPlaying) return;
            if(gameState.round > 10) { showEnd(); return; }
            updateTracker();
            const q = gameState.questionPool[gameState.round-1];
            gameState.ans = q.ans;
            let m = gameState.mode.id, symbol = {add:'+', sub:'-', mul:'×', div:'÷'}[m];
            let formula = m==='count' ? 'Count them!' : `${q.v1} ${symbol} ${q.v2} = ?`;
            
            app.innerHTML = `
                <div class="formula-card p-3 bounce-in text-center">
                    <div class="text-xs font-bold text-slate-400 mb-1">Question ${gameState.round}</div>
                    <div class="text-3xl font-black text-green-700 mb-2">${formula}</div>
                    <div id="visual-container"></div>
                    <div class="grid grid-cols-2 gap-3 mt-2 p-2">${genOpts(q.ans)}</div>
                </div>`;
            renderVisuals(q.v1, q.v2, m);
            speak([`Question ${gameState.round}`, formula]);
        }

        function renderVisuals(v1, v2, m) {
            const container = document.getElementById('visual-container');
            const isBeginnerCount = (m === 'count' && gameState.maxNum === 10);
            
            if(m!=='count' && gameState.maxNum >= 50 && !gameState.showAdvIcons) {
                container.innerHTML = `<div class="text-slate-300 text-xs italic">Icons hidden for Advanced/Expert mode</div>`;
                return;
            }

            let h = '';
            if(m==='mul' || m==='div') {
                container.className = "flex flex-wrap justify-center gap-2 overflow-y-auto w-full px-2";
                let groups = (m==='mul')?v1:v2, per = (m==='mul')?v2:gameState.ans;
                for(let g=0; g<groups; g++) {
                    h += `<div class="bg-slate-50 border border-dashed border-slate-300 rounded-lg p-1 flex flex-wrap justify-center gap-1">`;
                    for(let i=0; i<per; i++) h += `<span class="text-base">${m==='mul'?'🐝':'🍕'}</span>`;
                    h += `</div>`;
                }
            } else {
                let total = (m==='add') ? (v1+v2) : v1;
                h = `<div class="visual-grid">`;
                for(let i=1; i<=total; i++) {
                    let icon = m==='add' ? (i<=v1?'🍪':'🍓') : (m==='sub'?'🎈':'🍎');
                    let cross = (m==='sub' && i>(v1-v2)) ? 'crossed-out' : '';
                    
                    h += `<div class="flex flex-col items-center justify-center min-w-0">`;
                    if(isBeginnerCount && gameState.showLabels) {
                        h += `<span class="index-label">${i}</span>`;
                    }
                    h += `<div class="text-xl sm:text-2xl ${cross}">${icon}</div></div>`;
                }
                h += `</div>`;
            }
            container.innerHTML = h;
        }

        function genOpts(correct) {
            let o = [correct];
            while(o.length < 4) {
                let w = Math.max(0, correct + (Math.floor(Math.random()*10)-5));
                if(!o.includes(w)) o.push(w);
            }
            return o.sort(()=>Math.random()-0.5).map(v => `<button onclick="check(this, ${v})" class="bg-green-500 text-white text-2xl font-black py-3 rounded-xl shadow-md border-b-4 border-green-700 pop-out">${v}</button>`).join('');
        }

        function check(btn, v) {
            const correct = (v === gameState.ans);
            gameState.results.push(correct);
            if(correct) { 
                gameState.score++; 
                app.innerHTML = `<div class="feedback-card p-8 flex flex-col items-center justify-center bounce-in"><div class="text-8xl">👍</div></div>`; 
                speak(["Correct!"], () => { gameState.round++; nextRound(); }); 
            } else { 
                app.innerHTML = `
                    <div class="feedback-card p-8 flex flex-col items-center justify-center bounce-in">
                        <div class="text-7xl">😢</div>
                        <div class="mt-4 text-slate-500 font-bold text-xl">Correct answer is</div>
                        <div class="text-7xl font-black text-red-600">${gameState.ans}</div>
                    </div>`; 
                speak([`Incorrect. Correct answer is ${gameState.ans}`], () => { gameState.round++; nextRound(); }); 
            }
        }

        function updateTracker() {
            progressEl.innerHTML = '';
            for(let i=0; i<10; i++) {
                let color = gameState.results[i]===true ? 'bg-green-500' : (gameState.results[i]===false ? 'bg-red-500' : (i===gameState.round-1 ? 'bg-yellow-400' : 'bg-slate-200'));
                progressEl.innerHTML += `<div class="w-3 h-3 rounded-full ${color}"></div>`;
            }
            scoreEl.innerText = `Score: ${gameState.score}`;
        }

        function showEnd() { updateTracker(); speak(["Game Over!", `You scored ${gameState.score}`]); app.innerHTML = `<div class="text-center bounce-in"><div class="text-7xl mb-2">🏆</div><h2 class="text-2xl font-black text-slate-700">Score: ${gameState.score}/10</h2><button onclick="initMenu()" class="mt-4 bg-orange-500 text-white px-8 py-3 rounded-full font-black pop-out shadow-lg">REPLAY</button></div>`; }
        function confirmExit() { if(!gameState.isPlaying || confirm("Quit?")) initMenu(); }
        window.onload = initMenu;
    </script>
</body>
</html>
