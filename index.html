<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Math Mania</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            touch-action: manipulation; -webkit-user-select: none; user-select: none; overflow: hidden; 
            background: #f0fdf4; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .bounce-in { animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-out:active { transform: scale(0.9); }
        
        .formula-card { 
            background: white; 
            border: 6px solid #16a34a; 
            border-radius: 2rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 98%;
            max-width: 600px;
        }

        .crossed-out { position: relative; opacity: 0.3; filter: grayscale(100%); }
        .crossed-out::after { content: '❌'; position: absolute; top: 0; left: 0; font-size: 1.2em; text-shadow: 1px 1px 2px white; }
        
        /* Grid container: 11 columns (1 for row numbers + 10 for items) */
        .visual-grid {
            display: grid;
            grid-template-columns: 30px repeat(10, 1fr);
            gap: 2px;
            align-items: center;
            width: 100%;
        }

        .grid-header {
            font-weight: 900;
            color: #94a3b8;
            font-size: 0.75rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mode-card {
            transition: all 0.2s ease;
            border-bottom: 8px solid rgba(0,0,0,0.1);
        }
        .mode-card:hover { transform: translateY(-4px); }

        .level-btn {
            background: white;
            border: 6px solid;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-slate-800">

    <header class="p-4 flex flex-col items-center bg-white/50 shadow-sm">
        <div class="flex justify-between w-full items-center mb-2">
            <button onclick="confirmExit()" class="text-3xl bg-white rounded-full px-4 py-1 shadow-md pop-out border-2 border-red-500 leading-none font-bold text-red-500">⬅</button>
            <h1 class="text-3xl font-black text-green-600 tracking-tight uppercase">Math Mania</h1>
            <div id="score-display" class="bg-yellow-400 text-white px-4 py-1 rounded-full font-black shadow-sm">Score: 0</div>
        </div>
        <div id="progress-container" class="flex gap-2"></div>
    </header>

    <main id="app" class="flex-grow flex flex-col items-center justify-center p-2 relative overflow-y-auto"></main>

    <script>
        const app = document.getElementById('app');
        const progressEl = document.getElementById('progress-container');
        const scoreEl = document.getElementById('score-display');
        
        let gameState = { mode: null, maxNum: 10, round: 1, score: 0, ans: 0, total: 10, results: [] };

        function speak(t) { 
            window.speechSynthesis.cancel(); 
            const m = new SpeechSynthesisUtterance(t); 
            m.lang = 'en-US'; 
            m.rate = 0.9; 
            window.speechSynthesis.speak(m); 
        }

        function initMenu() {
            gameState.round = 1; gameState.score = 0; gameState.results = [];
            progressEl.innerHTML = '';
            app.innerHTML = `
                <div class="flex flex-col items-center gap-6 w-full max-w-md">
                    <div id="row-1" class="flex justify-center w-full"></div>
                    <div id="row-2" class="flex justify-center gap-6 w-full"></div>
                    <div id="row-3" class="flex justify-center gap-6 w-full"></div>
                </div>`;
            
            const mdes = [
                { id: 'count', label: 'Count', icon: '🍎', color: 'bg-red-400' },
                { id: 'add', label: 'Add', icon: '＋', color: 'bg-green-400' },
                { id: 'sub', label: 'Minus', icon: '－', color: 'bg-orange-400' },
                { id: 'mul', label: 'Times', icon: '×', color: 'bg-purple-400' },
                { id: 'div', label: 'Divide', icon: '÷', color: 'bg-pink-400' }
            ];

            const rows = ['row-1', 'row-2', 'row-2', 'row-3', 'row-3'];
            mdes.forEach((m, i) => {
                const card = document.createElement('div');
                card.className = `${m.color} mode-card h-32 w-full max-w-[160px] rounded-3xl shadow-xl flex flex-col items-center justify-center cursor-pointer bounce-in pop-out`;
                card.innerHTML = `<span class="text-6xl text-white font-bold">${m.icon}</span><span class="text-white font-black uppercase text-xs mt-1 tracking-widest">${m.label}</span>`;
                card.onclick = () => { speak(m.label); gameState.mode = m; showLevels(); };
                document.getElementById(rows[i]).appendChild(card);
            });
        }

        function showLevels() {
            const levels = [
                { num: 10, stars: '⭐', label: 'Beginner', color: 'border-yellow-300', text: 'yellow-600' },
                { num: 20, stars: '⭐⭐', label: 'Intermediate', color: 'border-orange-400', text: 'orange-600' },
                { num: 50, stars: '⭐⭐⭐', label: 'Advanced', color: 'border-red-500', text: 'red-600' },
                { num: 100, stars: '⭐⭐⭐⭐', label: 'Expert', color: 'border-purple-600', text: 'purple-700' }
            ];
            app.innerHTML = `<div class="grid grid-cols-2 gap-4 w-full max-w-lg">${levels.map(l => `
                <div onclick="start(${l.num})" class="level-btn ${l.color} h-40 rounded-3xl bounce-in pop-out">
                    <span class="text-3xl">${l.stars}</span>
                    <span class="text-2xl font-black ${l.text}">${l.label}</span>
                    <span class="text-slate-400 font-bold">Within ${l.num}</span>
                </div>`).join('')}</div>`;
        }

        function start(max) { gameState.maxNum = max; nextRound(); }

        function nextRound() {
            if (gameState.round > gameState.total) { showEnd(); return; }
            updateTracker();
            let v1, v2, formula, speech, m = gameState.mode.id;
            
            if (m === 'count') { v1 = Math.floor(Math.random() * gameState.maxNum) + 1; gameState.ans = v1; formula = `How many?`; speech = `How many?`; }
            else if (m === 'add') { v1 = Math.floor(Math.random() * (gameState.maxNum - 1)) + 1; v2 = Math.floor(Math.random() * (gameState.maxNum - v1)) + 1; gameState.ans = v1 + v2; formula = `${v1} + ${v2} = ?`; speech = `${v1} plus ${v2}`; }
            else if (m === 'sub') { v1 = Math.floor(Math.random() * (gameState.maxNum - 2)) + 2; v2 = Math.floor(Math.random() * v1) + 1; gameState.ans = v1 - v2; formula = `${v1} - ${v2} = ?`; speech = `${v1} minus ${v2}`; }
            else if (m === 'mul') { v1 = Math.min(Math.floor(Math.random() * 10) + 1, gameState.maxNum / 2); v2 = 2; gameState.ans = v1 * v2; formula = `${v1} × ${v2} = ?`; speech = `${v1} times ${v2}`; }
            else if (m === 'div') { gameState.ans = Math.floor(Math.random() * (gameState.maxNum / 2)) + 1; v2 = 2; v1 = gameState.ans * v2; formula = `${v1} ÷ ${v2} = ?`; speech = `${v1} share into ${v2}`; }

            app.innerHTML = `
                <div class="formula-card p-4 text-center bounce-in">
                    <div class="text-4xl font-black text-green-700 mb-4">${formula}</div>
                    <div class="flex justify-center items-center p-2 border rounded-xl bg-slate-50 overflow-x-auto">
                        <div class="visual-grid">${renderVisualGrid(v1, v2, m)}</div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-6">${genOpts(gameState.ans)}</div>
                </div>`;
            speak(speech);
        }

        function renderVisualGrid(v1, v2, m) {
            let h = '';
            let total = (m === 'add') ? (v1 + v2) : v1;
            let rowsNeeded = Math.ceil(total / 10);
            let sizeClass = total > 50 ? "text-xl" : "text-2xl";

            // 1. Top Header Row (Column Numbers 1-10)
            h += `<div class="grid-header">#</div>`; // Top-left corner spacer
            for (let c = 1; c <= 10; c++) h += `<div class="grid-header">${c}</div>`;

            // 2. Data Rows
            let itemCounter = 0;
            for (let r = 1; r <= rowsNeeded; r++) {
                // Row Label
                h += `<div class="grid-header border-r border-slate-200">${r}</div>`;
                
                // Row Items
                for (let c = 1; c <= 10; c++) {
                    itemCounter++;
                    if (itemCounter <= total) {
                        let icon = '🍎';
                        if (m === 'add') icon = (itemCounter <= v1) ? '🍪' : '🍓';
                        if (m === 'sub') icon = '🎈';
                        if (m === 'mul') icon = '🐝';
                        if (m === 'div') icon = '🍕';
                        
                        let isCrossed = (m === 'sub' && itemCounter > (v1 - v2)) ? 'crossed-out' : '';
                        h += `<div class="${sizeClass} ${isCrossed} flex justify-center">${icon}</div>`;
                    } else {
                        h += `<div></div>`; // Empty cell
                    }
                }
            }
            return h;
        }

        function genOpts(correct) {
            let o = [correct];
            while(o.length < 4) {
                let offset = gameState.maxNum > 50 ? 10 : 5;
                let w = Math.max(0, correct + (Math.floor(Math.random() * (offset * 2)) - offset));
                if(!o.includes(w)) o.push(w);
            }
            return o.sort(()=>Math.random()-0.5).map(v => `<button onclick="check(${v})" class="bg-green-500 text-white text-3xl font-black py-4 rounded-2xl shadow-lg border-b-8 border-green-700 pop-out">${v}</button>`).join('');
        }

        function check(v) {
            const correct = (v === gameState.ans);
            gameState.results.push(correct);
            if(correct) { gameState.score++; speak("Correct!"); app.innerHTML = `<div class="text-9xl bounce-in">👍</div>`; }
            else { speak(`Oops! It was ${gameState.ans}`); app.innerHTML = `<div class="text-9xl bounce-in">😢</div>`; }
            gameState.round++;
            setTimeout(nextRound, 1500);
        }

        function updateTracker() {
            progressEl.innerHTML = '';
            for(let i=0; i<gameState.total; i++) {
                const dot = document.createElement('div');
                let color = 'bg-gray-300';
                if (gameState.results[i] === true) color = 'bg-green-500';
                if (gameState.results[i] === false) color = 'bg-red-500';
                if (i === gameState.round - 1 && gameState.results[i] === undefined) color = 'bg-yellow-400 border-2 border-yellow-600';
                dot.className = `w-4 h-4 rounded-full ${color}`;
                progressEl.appendChild(dot);
            }
            scoreEl.innerText = `Score: ${gameState.score}`;
        }

        function showEnd() {
            updateTracker();
            app.innerHTML = `<div class="text-center bounce-in">
                <div class="text-8xl mb-4">🏆</div>
                <h2 class="text-3xl font-black mb-2 uppercase">Complete!</h2>
                <p class="text-xl font-bold mb-6">Score: ${gameState.score} / 10</p>
                <button onclick="initMenu()" class="bg-orange-500 text-white px-10 py-3 rounded-full text-xl font-black shadow-xl pop-out">PLAY AGAIN</button>
            </div>`;
        }

        function confirmExit() { if(confirm("Quit?")) initMenu(); }
        window.onload = initMenu;
    </script>
</body>
</html>
